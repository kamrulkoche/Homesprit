# Render Blueprint — creates the database, the API and the site in one go.
# Render dashboard -> New -> Blueprint -> pick this repo.
#
# ENVIRONMENT is "render", not "prod", on purpose: config/.env.prod is loaded
# with override=True and would clobber the variables set below (it forces
# SETUP_ADMIN=false and a placeholder CORS origin). No config/.env.render
# exists, so only .env.base loads and these values win. Every non-dev
# environment still gets the strict SECRET_KEY and schema-at-head checks.
#
# If Render had to suffix a service name (homesprit-api-xxxx), update the two
# URLs below to the real ones.

databases:
  - name: homesprit-db
    plan: free
    databaseName: homesprit
    user: homesprit

services:
  - type: web
    name: homesprit-api
    runtime: docker
    plan: free
    rootDir: homesprit-backend
    dockerfilePath: ./Dockerfile
    # Free instances have no pre-deploy step, so migrate before serving.
    dockerCommand: sh -c "alembic upgrade head && uvicorn src.api.app:app --host 0.0.0.0 --port ${PORT:-8001}"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: render
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: homesprit-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://homesprit.onrender.com"]'
      # Creates the first admin on boot if absent. Set to false once you can log in.
      - key: SETUP_ADMIN
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: homesprit
    runtime: node
    plan: free
    rootDir: homesprit-frontend
    buildCommand: npm ci && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Server-only. Free instances cannot receive private-network traffic, so
      # this is the API's public URL.
      - key: HOMESPRIT_BACKEND_URL
        value: https://homesprit-api.onrender.com
      # Inlined at build time — redeploy after changing it.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://homesprit.onrender.com
